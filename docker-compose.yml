services:
  price-engine:
    build: .
    container_name: price-engine-marketing-material
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Set to match the path segment your reverse proxy serves this under
      # (e.g. "price-engine-marketing-material" for 10.2.1.19/price-engine-marketing-material).
      # Leave unset/empty to serve from the root path instead.
      - STREAMLIT_SERVER_BASE_URL_PATH=price-engine-marketing-material
